<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>歡迎來到 The Hope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: #1D292E;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 28px;
      position: relative;
      overflow: hidden;
    }

    .page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 60% 35%, rgba(255,204,50,0.07) 0%, transparent 65%);
      pointer-events: none;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(255,204,50,0.4);
      color: #FFCC32;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 32px;
    }

    h1 {
      font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
      font-size: clamp(2.4rem, 7vw, 5rem);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      color: #fff;
    }

    h1 span { color: #FFCC32; }

    .subtitle {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      line-height: 1.75;
      color: rgba(255,255,255,0.65);
      max-width: 480px;
      margin: 0 auto 12px;
    }

    .card-note {
      font-size: 0.88rem;
      line-height: 1.65;
      color: rgba(255,204,50,0.75);
      max-width: 400px;
      margin: 0 auto 40px;
    }

    .cta {
      display: inline-block;
      background: #FFCC32;
      color: #1D292E;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 16px 40px;
      border-radius: 8px;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
      cursor: pointer;
    }

    .cta:hover { transform: translateY(-2px); opacity: 0.9; }

    .footnote {
      margin-top: 18px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.3);
    }

    @media (prefers-reduced-motion: reduce) {
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="tag">YOU BELONG HERE</div>

    <h1>
      不論你來自哪裡<br />
      <span>你都能屬於這裡</span>
    </h1>

    <p class="subtitle">
      歡迎來到 The Hope！<br />
      邀請你填寫新朋友表單，讓我們認識彼此，陪你在這裡找到家。
    </p>

    <p class="card-note">
      🎁 我們期待將一份精美的小卡片寄到你手中——<br />
      如果你願意的話，可以在表單中分享你的地址！
    </p>

    <a href="https://thehope.my.salesforce-sites.com/bindingregistration_page" class="cta" target="_blank" rel="noopener">
      填寫新朋友表單
    </a>

  </div>
</body>
</html>
